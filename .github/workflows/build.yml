# Beta builds on GitHub's hosted runners: checks on Linux, then packages for Linux x64, Windows x64 and macOS on
# Apple silicon (owner's choice, 2026-10-24). Native modules (nodegit, node-pty, nsfw) are compiled for the CPU
# of the machine that builds them, so every OS/CPU needs its own runner: arm64 Linux/Windows or Intel macOS would
# be further matrix entries (ubuntu-22.04-arm, windows-11-arm, macos-15-intel). Packages are not signed yet (T-004): macOS asks to open the app with right-click → Open, Windows
# SmartScreen shows "More info → Run anyway".
#
# Run it by hand (Actions → Build → Run workflow), or push a tag v* (e.g. v0.4.1): after all packages
# succeed, a pre-release is published with the installers from every platform.
name: Build

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the end-to-end tests too (about 15 minutes more)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Checks (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang-15 python3 perl libkrb5-dev git git-lfs zsh xvfb xauth \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libsecret-1-0 libnotify4
          # Electron 45's V8 headers use an attribute combination that GCC 12 and older cannot parse.
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
          git lfs install

      # OpenSSL for nodegit, built once per runner image and lock file (see scripts/rebuild-native.mjs).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/forklift-openssl
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        env:
          FORKLIFT_OPENSSL_CACHE: ${{ runner.temp }}/forklift-openssl
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
          node scripts/rebuild-native.mjs

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # tests/e2e/run.mjs starts its own xvfb.
      - if: ${{ inputs.e2e || startsWith(github.ref, 'refs/tags/') }}
        run: npm run test:e2e

  package:
    name: Package ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-22.04, os: linux, arch: x64 }
          - { name: windows-x64, runner: windows-2022, os: win, arch: x64 }
          - { name: macos-arm64, runner: macos-15, os: mac, arch: arm64 }
    env:
      # Unsigned beta builds: electron-builder must not look for signing identities.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # node-gyp needs Python; 3.12 as in scripts/build-windows.ps1.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolchain (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential clang-15 perl libkrb5-dev
          # Electron 45's V8 headers use an attribute combination that GCC 12 and older cannot parse.
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"

      # nodegit's build asks for Visual Studio's Spectre-mitigated libraries; the runner image may lack them.
      - name: Toolchain (Windows)
        if: ${{ matrix.os == 'win' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -property installationPath
          $spectre = if ('${{ matrix.arch }}' -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre' } else { 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre' }
          $tools = if ('${{ matrix.arch }}' -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          if (-not (& $vswhere -latest -products * -version '[17.0,18.0)' -requires $spectre $tools -property installationPath)) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
            $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', $spectre, '--add', $tools, '--quiet', '--norestart', '--nocache')
            if (@(0, 3010) -notcontains $process.ExitCode) { throw "Visual Studio Installer failed ($($process.ExitCode))" }
          }
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          "GYP_MSVS_OVERRIDE_PATH=$vs" >> $env:GITHUB_ENV

      # OpenSSL for nodegit, built once per runner image and lock file (see scripts/rebuild-native.mjs).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/forklift-openssl
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      # Without install scripts: nodegit's own would build it for plain Node (and npm often fails with EBUSY on
      # Windows); scripts/rebuild-native.mjs builds every native module for Electron instead.
      - name: Install
        shell: bash
        env:
          FORKLIFT_OPENSSL_CACHE: ${{ runner.temp }}/forklift-openssl
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
          node scripts/rebuild-native.mjs

      - name: Load the native modules in Electron
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npx electron -e "for (const m of ['@axosoft/nodegit', 'node-pty', 'nsfw', 'find-git-repositories']) { require(m); console.log('OK', m); }"

      - name: Package
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            linux) targets=(--linux AppImage) ;;
            win) targets=(--win nsis zip) ;;
            mac) targets=(--mac dmg zip) ;;
          esac
          npm run dist -- "${targets[@]}" --${{ matrix.arch }} --publish never

      - name: Check fuses of the packaged app
        run: node scripts/check-fuses.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: forklift-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # Publish one pre-release only after every platform has packaged successfully.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: forklift-*

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for platform in linux-x64 windows-x64 macos-arm64; do
            test -d "packages/forklift-$platform"
          done
          shopt -s nullglob
          assets=(packages/forklift-*/*)
          if (( ${#assets[@]} != 5 )); then
            echo "Expected 5 packages from Linux, Windows and macOS; found ${#assets[@]}" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Forklift $tag" --generate-notes
